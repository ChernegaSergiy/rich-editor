<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rich-редактор · @nl_pe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<style>
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.5rem;margin-top:.5rem}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--pico-border-radius);display:block;border:1px solid var(--pico-muted-border-color)}
.thumb nav{display:flex;gap:.25rem;margin-top:.25rem}
button.s{width:auto;padding:.15rem .6rem;font-size:.85rem;margin:0}
.bubble{border:1px solid var(--pico-muted-border-color);border-radius:var(--pico-border-radius);padding:.75rem 1rem;margin-bottom:.5rem}
.bubble .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:.5rem 0}
.bubble .grid img{width:100%;border-radius:4px;display:block}
pre.src{font-size:.75rem;max-height:220px;overflow:auto}
.block-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.block-head strong{flex:1}
</style>
</head>
<body>
<main class="container" id="gate">
<article style="max-width:440px;margin:10vh auto">
<h1>Rich-редактор</h1>
<p>Дописи в канал без Premium: текст — абзацами, фото — слайдшоу.</p>
<form onsubmit="login();return false">
<label>ADMIN_KEY<input type="password" id="key" autocomplete="off" autofocus></label>
<button type="submit">Увійти</button>
</form>
<p><small id="gate_err" style="color:var(--pico-del-color)"></small></p>
</article>
</main>

<main class="container" id="app" style="display:none">
<h1>Rich-редактор · <small id="ch"></small></h1>
<div role="group">
<button id="tab_c" onclick="tab('c')">Допис</button>
<button id="tab_p" class="secondary" onclick="tab('p')">Надіслані</button>
</div>

<section id="pane_c">
<article><h2>Блоки</h2><div id="blocks"></div>
<div role="group">
<button class="secondary" onclick="add('p')">+ Абзац</button>
<button class="secondary" onclick="add('h')">+ Заголовок</button>
<button class="secondary" onclick="add('slideshow')">+ Слайдшоу</button>
<button class="secondary" onclick="add('divider')">+ Розділювач</button>
</div>
<p><small>Розмітка: **жирний**, *курсив*, `код`, [текст](https://url). Довгий текст — абзацами, а не підписом.</small></p>
</article>

<article><h2>Як побачать читачі</h2><div id="pv"><small>Порожньо.</small></div>
<details><summary>Точний HTML для Telegram</summary><pre class="src" id="src">—</pre></details>
</article>

<article><h2>Публікація</h2>
<div class="grid">
<label>Канал<input id="chat"></label>
<label>message_id для правки чужого<input id="mid" placeholder="порожньо — свій"></label>
</div>
<div role="group">
<button onclick="send()">Надіслати новий</button>
<button class="secondary" onclick="saveEdit()">Зберегти правку</button>
</div>
<p><small id="editinfo"></small></p>
<p id="res"></p>
</article>
</section>

<section id="pane_p" style="display:none">
<article><h2>Надіслані дописи</h2>
<button class="secondary" onclick="loadPosts()">Оновити</button>
<div id="posts"></div></article>
</section>
</main>

<script>
let K=localStorage.getItem('re_key')||'';
let BL=[];let editing=null;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(t){
  let o=esc(t);
  o=o.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
     .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g,'<i>$1</i>')
     .replace(/`(.+?)`/g,'<code>$1</code>')
     .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2">$1</a>');
  return o.replace(/\n/g,'<br>');
}
async function api(p,m,b,form){
  const h={'X-Auth-Key':K};let o={method:m||'GET',headers:h};
  if(form){o.body=form}else if(b!==undefined){h['Content-Type']='application/json';o.body=JSON.stringify(b)}
  const r=await fetch(p,o);return r.json();
}
async function login(){
  K=$('key').value.trim();localStorage.setItem('re_key',K);
  const r=await api('/api/config');if(r.ok){enter()}else{$('gate_err').textContent='Невірний ключ'}
}
async function enter(){
  $('gate').style.display='none';$('app').style.display='block';
  const r=await api('/api/config');
  $('ch').textContent=r.channel;$('chat').value=r.channel;
  if(!BL.length)add('slideshow');
}
function tab(t){
  $('tab_c').className=t=='c'?'':'secondary';
  $('tab_p').className=t=='p'?'':'secondary';
  $('pane_c').style.display=t=='c'?'block':'none';
  $('pane_p').style.display=t=='p'?'block':'none';
  if(t=='p')loadPosts();
}
function add(t){
  const b={t};if(t=='p')b.text='';if(t=='h'){b.level=2;b.text=''}
  if(t=='slideshow'){b.photos=[];b.caption=''}
  BL.push(b);render();vprev();
}
function del(i){BL.splice(i,1);render();vprev()}
function mv(i,d){const j=i+d;if(j<0||j>=BL.length)return;const x=BL[i];BL[i]=BL[j];BL[j]=x;render();vprev()}
function phmv(bi,i,d){const p=BL[bi].photos;const j=i+d;if(j<0||j>=p.length)return;const x=p[i];p[i]=p[j];p[j]=x;render();vprev()}
function phdel(bi,i){BL[bi].photos.splice(i,1);render();vprev()}
async function up(bi,files){
  for(const f of files){
    const fd=new FormData();fd.append('photo',f);
    const r=await api('/api/upload','POST',null,fd);
    if(r.ok)BL[bi].photos.push({up:r.upload_id,url:r.preview_url});else alert(r.description);
  }
  render();vprev();
}
const NAMES={p:'Абзац',h:'Заголовок',slideshow:'Слайдшоу',divider:'Розділювач'};
function render(){
  const w=$('blocks');w.innerHTML='';
  BL.forEach((b,i)=>{
    const d=document.createElement('article');d.style.margin='0 0 .75rem';
    let h='<div class="block-head"><strong>'+NAMES[b.t]+'</strong>'
      +'<button class="s secondary" onclick="mv('+i+',-1)">↑</button>'
      +'<button class="s secondary" onclick="mv('+i+',1)">↓</button>'
      +'<button class="s secondary" onclick="del('+i+')">✕</button></div>';
    if(b.t=='p')h+='<textarea oninput="BL['+i+'].text=this.value;vprev()">'+esc(b.text||'')+'</textarea>';
    if(b.t=='h')h+='<div class="grid"><label>Рівень 1–6<input value="'+(b.level||2)+'" oninput="BL['+i+'].level=this.value;vprev()"></label>'
      +'<label>Текст<textarea oninput="BL['+i+'].text=this.value;vprev()">'+esc(b.text||'')+'</textarea></label></div>';
    if(b.t=='slideshow'){
      h+='<input type="file" accept="image/*" multiple onchange="up('+i+',this.files)"><div class="thumbs">';
      (b.photos||[]).forEach((p,j)=>{
        h+='<div class="thumb"><img src="'+p.url+'"><nav><button class="s secondary" onclick="phmv('+i+','+j+',-1)">←</button>'
          +'<button class="s secondary" onclick="phmv('+i+','+j+',1)">→</button>'
          +'<button class="s secondary" onclick="phdel('+i+','+j+')">✕</button></nav></div>';
      });
      h+='</div><label style="margin-top:.5rem">Короткий підпис (можна порожньо)<input value="'+esc(b.caption||'').replace(/"/g,'&quot;')+'" oninput="BL['+i+'].caption=this.value;vprev()"></label>';
    }
    d.innerHTML=h;w.appendChild(d);
  });
  $('editinfo').textContent=editing?('Правка поста #'+editing):'';
}
function vprev(){
  let h='';
  for(const b of BL){
    if(b.t=='p')h+='<div class="bubble">'+md(b.text||'…')+'</div>';
    else if(b.t=='h'){const l=Math.min(3,Math.max(1,+b.level||2));h+='<div class="bubble"><h'+l+'>'+md(b.text||'…')+'</h'+l+'></div>'}
    else if(b.t=='divider')h+='<hr>';
    else if(b.t=='slideshow'){
      h+='<div class="bubble"><div class="grid">';
      (b.photos||[]).forEach(p=>{h+='<img src="'+p.url+'">'});
      h+='</div>'+(b.caption?('<small>'+md(b.caption)+'</small>'):'')+'</div>';
    }
  }
  $('pv').innerHTML=h||'<small>Порожньо.</small>';
}
async function preview(){
  const r=await api('/api/preview','POST',{blocks:BL});
  $('src').textContent=r.ok?r.html:('Помилка: '+r.description);
}
async function send(){
  await preview();
  const r=await api('/api/send','POST',{chat:$('chat').value,blocks:BL});
  $('res').innerHTML=r.ok?('Опубліковано: <a target="_blank" href="'+r.link+'">'+r.link+'</a>'):('Помилка: '+r.description);
}
async function saveEdit(){
  await preview();
  const mid=$('mid').value.trim();
  const b={blocks:BL};if(editing)b.post_id=editing;else if(mid)b.message_id=+mid;
  else{alert('Нема чого правити: відкрий пост зі списку або введи message_id');return}
  b.chat=$('chat').value;
  const r=await api('/api/edit','POST',b);
  $('res').innerHTML=r.ok?('Збережено: <a target="_blank" href="'+r.link+'">'+r.link+'</a>'):('Помилка: '+r.description);
}
async function loadPosts(){
  const r=await api('/api/posts');const w=$('posts');w.innerHTML='';
  if(!r.ok){w.textContent='Помилка: '+r.description;return}
  if(!r.posts.length){w.innerHTML='<p>Поки порожньо.</p>';return}
  r.posts.forEach(p=>{
    const d=document.createElement('div');
    d.innerHTML='<hr><div><a target="_blank" href="'+p.link+'">#'+p.message_id+'</a> · '+esc(p.chat)+' · '+esc(p.created_at.slice(0,16).replace('T',' '))+'<br><small>'+esc(p.excerpt)+'</small></div>';
    const g=document.createElement('div');g.setAttribute('role','group');
    const e=document.createElement('button');e.className='secondary';e.textContent='Правити';
    e.onclick=async()=>{const q=await api('/api/posts/'+p.id);if(q.ok){BL=q.post.blocks;editing=p.id;render();vprev();preview();tab('c')}};
    const x=document.createElement('button');x.className='secondary';x.textContent='Видалити';
    x.onclick=async()=>{if(confirm('Видалити пост #'+p.message_id+'?')){await api('/api/delete','POST',{post_id:p.id});loadPosts()}};
    g.appendChild(e);g.appendChild(x);d.appendChild(g);w.appendChild(d);
  });
}
if(K)login();
</script>
</body>
</html>
